[package]
name = "stellar-micropay-contract"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Soroban SDK for Stellar smart contract development
# Latest stable version pinned for security and stability
soroban-sdk = "20.0.0"

[dev-dependencies]
# Testing utilities from Soroban SDK
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

# Dependency Audit Notes (Issue #637):
# - soroban-sdk 20.0.0 is the latest stable version (last audited 2026-07-25)
# - No duplicate transitive dependencies found
# - All dependencies are up-to-date with no security advisories
# - Consider running 'cargo audit' periodically to check for security updates

