version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  frontend:
    image: ghcr.io/chidubemkingsley/stellar-micropay-frontend:staging
    ports:
      - "3000:80"
    volumes:
      - frontend_static:/usr/share/nginx/html
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
      - NEXT_PUBLIC_API_URL=https://staging.stellarmicropay.io/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  backend:
    image: ghcr.io/chidubemkingsley/stellar-micropay-backend:staging
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=staging
      - STELLAR_NETWORK=testnet
      - HORIZON_URL=https://horizon-testnet.stellar.org
      - ALLOWED_ORIGINS=https://staging.stellarmicropay.io
      - FEDERATION_DOMAIN=stellarmicropay.io
      - FEDERATION_DOMAINS=stellarmicropay.io,stellarmicropay.com
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

volumes:
  frontend_static: